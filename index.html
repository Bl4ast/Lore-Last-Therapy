<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquivo Psiquiátrico 1938 - C. Valadares</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper-base: #d2c19d;
            --ink-black: #1a1a1a;
            --stamp-red: #7c2020;
            --border-color: #2b2b2b;
        }

        body {
            background-color: #0a0a0a;
            background-image: radial-gradient(circle at center, #1a1510 0%, #000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Special Elite', monospace;
            overflow: hidden;
        }

        /* Container do Papel */
        .document-container {
            position: relative;
            width: 90vw;
            max-width: 800px;
            height: 90vh;
            max-height: 900px;
            perspective: 2000px;
        }

        .paper-sheet {
            background-color: var(--paper-base);
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            padding: 50px 60px;
            box-shadow: -10px 10px 40px rgba(0,0,0,0.8);
            border: 1px solid rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transform-origin: left center;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s ease, visibility 0.8s;
            z-index: 10;
        }

        /* Textura de papel MUITO sujo e envelhecido */
        .paper-sheet::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            background-image: 
                url("https://www.transparenttextures.com/patterns/handmade-paper.png"),
                radial-gradient(circle at 20% 20%, rgba(139, 115, 85, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(60, 40, 20, 0.5) 0%, transparent 50%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.2'/%3E%3C/svg%3E");
            mix-blend-mode: multiply;
            z-index: 50;
        }

        /* Estados da Página - Deslize Lateral */
        .paper-sheet.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(0) rotate(0deg);
            z-index: 30;
        }

        .paper-sheet.turned {
            transform: translateX(-120%) rotate(-5deg);
            opacity: 0;
            visibility: hidden;
            z-index: 40;
        }

        /* Layout da Ficha de Admissão */
        .form-header {
            text-align: center;
            border: 2px solid var(--border-color);
            padding: 10px;
            margin-bottom: 20px;
            text-transform: uppercase;
            background: rgba(0,0,0,0.05);
        }

        .admission-table {
            width: 100%;
            border: 2px solid var(--border-color);
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .admission-table td {
            border: 1px solid var(--border-color);
            padding: 8px;
            vertical-align: top;
        }

        .photo-cell {
            width: 140px;
            height: 170px;
            text-align: center;
            background: rgba(0,0,0,0.05);
        }

        .photo-box {
            width: 120px;
            height: 150px;
            margin: 0 auto;
            border: 1px solid #444;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 0 10px #000;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: sepia(0.8) contrast(1.2) grayscale(0.4);
            opacity: 0.7;
        }

        .field-label {
            font-size: 0.65rem;
            font-weight: bold;
            display: block;
            margin-bottom: 2px;
            color: #333;
            text-transform: uppercase;
        }

        .field-value {
            font-family: 'Special Elite', monospace;
            font-size: 1rem;
            color: var(--ink-black);
            font-weight: bold;
        }

        .lore-box {
            border: 1px solid var(--border-color);
            padding: 15px;
            flex-grow: 1;
            background: rgba(0,0,0,0.03);
            position: relative;
            overflow: hidden;
        }

        /* Tipografia */
        .typewriter {
            line-height: 1.5;
            text-align: justify;
            font-size: 0.95rem;
        }

        /* Carimbos */
        .stamp {
            font-family: 'Special Elite', monospace;
            color: var(--stamp-red);
            border: 4px solid var(--stamp-red);
            padding: 5px 15px;
            font-weight: bold;
            text-transform: uppercase;
            position: absolute;
            opacity: 0.4;
            mix-blend-mode: multiply;
            z-index: 60;
            pointer-events: none;
            font-size: 1.6rem;
            border-radius: 4px;
        }

        /* Navegação */
        .nav-controls {
            position: absolute;
            bottom: 20px;
            left: 0; right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 100;
        }

        .nav-btn {
            background: rgba(0,0,0,0.1);
            border: 1px solid var(--ink-black);
            padding: 6px 15px;
            cursor: pointer;
            font-family: 'Special Elite', monospace;
            transition: 0.2s;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .nav-btn:hover:not(:disabled) {
            background: var(--ink-black);
            color: var(--paper-base);
        }

        .nav-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        /* Manchas de Humidade e Sujeira */
        .stain {
            position: absolute;
            background: radial-gradient(circle, rgba(90, 60, 30, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 55;
            mix-blend-mode: multiply;
            filter: blur(5px);
        }

    </style>
</head>
<body>

    <div class="document-container">
        <div id="pages-wrapper">
            <!-- As páginas serão injetadas aqui -->
        </div>

        <div class="nav-controls">
            <button id="prevBtn" class="nav-btn" disabled>« Voltar</button>
            <span id="pageCounter" class="text-[10px] self-center opacity-40 font-bold">CARREGANDO...</span>
            <button id="nextBtn" class="nav-btn">Próxima »</button>
        </div>
    </div>

    <script>
        /* ============================================================
           ÁREA DE EDIÇÃO - MUDE AS INFORMAÇÕES ABAIXO
           ============================================================ */
        const CONFIG = {
            hospital: "HOSPÍCIO HOLLOWAY",
            paciente: "Cassiano Valadares",
            idade: "24",
            oficio: "Fotógrafo",
            data: "14.11.1948",
            processo: "REG-772/C",
            foto_url: "7fef63196f6424e03349a886e6367e15.jpg", // Insira o link da foto entre as aspas

            // CONTEÚDO DAS PÁGINAS (Edite os textos aqui)
            paginas: [
                {
                    titulo: "REGISTRO DE ADMISSÃO",
                    carimbo: "GERAL",
                    resumo_relatorio: 
                    "Não sei oq escrever aqui ainda."
                },
                {
                    titulo: "LORE E ANTECEDENTES",
                    carimbo: "LORE",
                    lore: 
                    "To pensando"
                },
                {
                    titulo: "ANÁLISE DE CONDIÇÕES",
                    carimbo: "VETADO",
                    diagnosticos: [
                        {
                            nome: "ANANTROPMNÉSIA (DISSOCIAÇÃO FIGURA-FUNDO)",
                            desc: "O paciente descreve o mundo como um negativo fotográfico mal revelado. Enquanto retém detalhes do ambiente, a figura humana é processada como um espaço vazio ou uma silhueta de luz."
                        },
                        {
                            nome: "EISBOLOPRAXIA (IMPULSIVIDADE REFRATÁRIA)",
                            desc: "Ideias intrusivas tornam-se ações motoras instantâneas. O paciente é incapaz de ignorar o 'chamado' do paladar sinestésico."
                        }
                    ]
                },
                {
                    titulo: "PARECER FINAL",
                    carimbo: "ARQUIVADO",
                    parecer_medico: 
                    "Vou colocar algo bem criativo aqui!",
                    conselho: "CONSELHO DE NEUROLOGIA"
                }
            ]
        };

        /* ============================================================
           LÓGICA DO SISTEMA - NÃO PRECISA MEXER ABAIXO
           ============================================================ */
        let current = 0;

        function render() {
            const wrapper = document.getElementById('pages-wrapper');
            const pagesHtml = CONFIG.paginas.map((p, i) => {
                let innerContent = "";

                // Página 1: Tabela de Admissão
                if (i === 0) {
                    innerContent = `
                        <div class="form-header">
                            <h1 class="text-lg font-bold">${CONFIG.hospital}</h1>
                            <p class="text-[10px]">DEPARTAMENTO DE PESQUISA COGNITIVA</p>
                        </div>
                        <table class="admission-table">
                            <tr>
                                <td rowspan="3" class="photo-cell">
                                    <div class="photo-box">
                                        ${CONFIG.foto_url ? `<img src="${CONFIG.foto_url}" alt="Foto">` : '<span class="text-[10px] text-gray-600 uppercase">RETRATO<br>Nº 772</span>'}
                                    </div>
                                </td>
                                <td>
                                    <span class="field-label">Paciente</span>
                                    <span class="field-value">${CONFIG.paciente}</span>
                                </td>
                                <td>
                                    <span class="field-label">ID Proc.</span>
                                    <span class="field-value">${CONFIG.processo}</span>
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <span class="field-label">Idade</span>
                                    <span class="field-value">${CONFIG.idade} Anos</span>
                                </td>
                                <td>
                                    <span class="field-label">Emissão</span>
                                    <span class="field-value">${CONFIG.data}</span>
                                </td>
                            </tr>
                            <tr>
                                <td colspan="2">
                                    <span class="field-label">Ofício Declarado</span>
                                    <span class="field-value">${CONFIG.oficio}</span>
                                </td>
                            </tr>
                        </table>
                        <div class="lore-box">
                            <span class="field-label italic underline">RELATÓRIO DE CAMPO</span>
                            <div class="typewriter text-xs mt-2">${p.resumo_relatorio}</div>
                        </div>`;
                } 
                // Página 2: Lore
                else if (i === 1) {
                    innerContent = `
                        <div class="form-header"><h2 class="text-md font-bold">HISTÓRICO COMPLEMENTAR</h2></div>
                        <div class="lore-box">
                            <div class="typewriter text-sm">${p.lore}</div>
                        </div>`;
                } 
                // Página 3: Condições
                else if (i === 2) {
                    innerContent = `
                        <div class="form-header"><h2 class="text-md font-bold">DISFUNÇÕES ESPECÍFICAS</h2></div>
                        <div class="space-y-4 typewriter text-sm">
                            ${p.diagnosticos.map(d => `
                                <div class="border-b border-black pb-2">
                                    <span class="field-label">${d.nome}</span>
                                    <p>${d.desc}</p>
                                </div>`).join('')}
                        </div>`;
                } 
                // Página 4: Parecer
                else if (i === 3) {
                    innerContent = `
                        <div class="form-header"><h2 class="text-md font-bold">CONSIDERAÇÕES MÉDICAS</h2></div>
                        <div class="lore-box">
                            <p class="typewriter text-sm italic">${p.parecer_medico}</p>
                        </div>
                        <div class="mt-16 flex justify-between items-end">
                            <div class="text-center">
                                <div class="w-32 border-b border-black mb-1"></div>
                                <span class="field-label">RUBRICA DO PACIENTE</span>
                            </div>
                            <div class="text-center">
                                <p class="font-serif italic text-sm mb-1">${p.medico_nome}</p>
                                <div class="w-40 border-b border-black mb-1"></div>
                                <span class="field-label">${p.conselho}</span>
                            </div>
                        </div>`;
                }

                return `
                    <div class="paper-sheet ${i === 0 ? 'active' : ''}" id="p-${i}">
                        <div class="stain" style="width:${100 + Math.random()*200}px; height:${100 + Math.random()*200}px; top:${Math.random()*80}%; left:${Math.random()*80}%;"></div>
                        ${p.carimbo ? `<div class="stamp" style="top:${40 + (i*15)}px; right:30px; transform:rotate(${i % 2 === 0 ? -15 : 12}deg);">${p.carimbo}</div>` : ''}
                        <div class="text-center text-[10px] opacity-40 italic mb-4 tracking-[0.4em]">-- ${p.titulo} --</div>
                        ${innerContent}
                    </div>`;
            }).join('');
            
            wrapper.innerHTML = pagesHtml;
            update();
        }

        function update() {
            const pages = document.querySelectorAll('.paper-sheet');
            pages.forEach((p, i) => {
                p.classList.remove('active', 'turned');
                if (i === current) p.classList.add('active');
                else if (i < current) p.classList.add('turned');
            });

            document.getElementById('pageCounter').textContent = `Fls. 0${current + 1} / 0${CONFIG.paginas.length}`;
            document.getElementById('prevBtn').disabled = current === 0;
            document.getElementById('nextBtn').disabled = current === CONFIG.paginas.length - 1;
        }

        document.getElementById('nextBtn').addEventListener('click', () => { if (current < CONFIG.paginas.length - 1) { current++; update(); } });
        document.getElementById('prevBtn').addEventListener('click', () => { if (current > 0) { current--; update(); } });

        render();
    </script>
</body>
</html>
